[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphavalue-research"
version = "1.5.0"
description = "Certified Alpha Capacity and alpha survival-frontier diagnostics"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Nicolò Bonacorsi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=2.2"]
plot = ["matplotlib>=3.8", "pandas>=2.2"]

[project.scripts]
alphavalue = "alphavalue.__main__:main"

[tool.setuptools]
packages = ["alphavalue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
