name: Temporary Toobit Funding Diagnostic
on:
  push:
    branches: [temp-toobit-screen-20261007]
    paths:
      - tools/toobit_funding_diag.py
      - .github/workflows/temp-toobit-funding-diag.yml
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/toobit_funding_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: toobit-funding-diag
          path: toobit_funding_diag.json
          retention-days: 1
