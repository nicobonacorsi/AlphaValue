name: Temporary Toobit Top15 Raw Collector
on:
  push:
    branches: [temp-toobit-screen-20261007]
    paths:
      - tools/toobit_raw_collect.py
      - .github/workflows/temp-toobit-raw-collect.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python tools/toobit_raw_collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toobit-top15-public-raw
          path: toobit_raw/
          if-no-files-found: error
          retention-days: 1
